services:

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      CHROMA_PATH: /app/data/chroma       # ChromaDB 路徑，存在 db_data volume 內
      DB_PATH: /app/data/monitoring.db    # SQLite 路徑
    volumes:
      - db_data:/app/data                 # SQLite + ChromaDB 共用同一個 volume
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s                   # RAG ingest 需要多一點冷啟動時間

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
      DB_PATH: /app/data/monitoring.db
    volumes:
      - db_data:/app/data
    depends_on:
      api:
        condition: service_healthy

volumes:
  db_data:                                # named volume，由 Docker 管理
